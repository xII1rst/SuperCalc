<div id="app" style="display:none">
  <header>
    <button class="mod-back al" data-action="closeModule" data-arg="vectors" style="flex-shrink:0"><svg class="sc-icon" aria-hidden="true"><use href="#sc-icon-arrow-left"></use></svg> Álgebra</button>
    <div class="logo">
      <div class="logo-icon"><svg class="sc-icon" aria-hidden="true"><use href="#sc-icon-vector"></use></svg></div>
      <div class="logo-inner">
        <div class="logo-text">Vector<span>3D</span></div>
      </div>
    </div>
    <div class="header-controls">
      <!-- DEC/FRAC -->
      <div class="icon-tog" id="frac-tog" data-action="toggleFrac" role="button" tabindex="0">
        <span class="tog-lbl" id="frac-lbl">DEC</span>
        <div class="sw"><div class="sw-track"></div><div class="sw-knob"></div></div>
      </div>
      <!-- Figura geométrica -->
      <div class="icon-tog" id="fig-tog" data-action="toggleFigure" role="button" tabindex="0">
        <span class="tog-lbl" id="fig-lbl">FIG</span>
        <div class="sw"><div class="sw-track"></div><div class="sw-knob"></div></div>
      </div>
      <!-- R2/R3 -->
      <div class="pill">
        <button id="br2" data-action="setMode" data-arg="2" data-arg-type="number">R²</button>
        <button id="br3" class="on" data-action="setMode" data-arg="3" data-arg-type="number">R³</button>
      </div>
    </div>
  </header>

  <div id="app-body">
  <div id="cw">
    <canvas id="c"></canvas>
    <div id="legend"></div>
    <button id="btn-reset" data-action="resetView"><svg class="sc-icon" aria-hidden="true"><use href="#sc-icon-reset"></use></svg> Reset</button>
  </div>

  <div id="panel-tog-wrap">
    <div id="panel-tog-btn" class="on" data-action="togglePanel" role="button" tabindex="0">
      <span class="tog-lbl" id="panel-tog-lbl">Panel</span>
      <div class="sw"><div class="sw-track"></div><div class="sw-knob"></div></div>
    </div>
  </div>
  <div id="bottom">
    <div class="tabs">
      <button class="tab on" data-action="showTab" data-arg="V">Vectores</button>
      <button class="tab" data-action="showTab" data-arg="M">Cálculos</button>
      <button class="tab" data-action="showTab" data-arg="O">Operaciones</button>
      <button class="tab" data-action="showTab" data-arg="E">Ecuación</button>
      <button class="tab" data-action="showTab" data-arg="I">Incógnita</button>
      <button class="tab" data-action="showTab" data-arg="T">Triángulo</button>
      <button class="tab" data-action="showTab" data-arg="F">Figuras</button>
    </div>
    <div id="pV" class="panel on"></div>
    <div id="pM" class="panel"></div>
    <div id="pO" class="panel"></div>
    <div id="pE" class="panel"></div>
    <div id="pI" class="panel"></div>
    <div id="pT" class="panel">
      <div class="u-pad">
        <div class="section-title">Triángulo en el espacio R³</div>
        <div class="u-note-math">
          Ingresa las coordenadas de los 3 vértices.<br>Se calcularán lados, ángulos internos y se graficará.
        </div>

        <!-- Punto P -->
        <div class="u-mb-2">
          <div style="font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--gold);margin-bottom:6px;">Punto P</div>
          <div class="u-row-wrap">
            <div class="inp-group"><label>x</label><input type="number" id="tri-px" value="2" step="any"/></div>
            <div class="inp-group"><label>y</label><input type="number" id="tri-py" value="5" step="any"/></div>
            <div class="inp-group"><label>z</label><input type="number" id="tri-pz" value="8" step="any"/></div>
          </div>
        </div>
        <!-- Punto Q -->
        <div class="u-mb-2">
          <div style="font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px;">Punto Q</div>
          <div class="u-row-wrap">
            <div class="inp-group"><label>x</label><input type="number" id="tri-qx" value="5" step="any"/></div>
            <div class="inp-group"><label>y</label><input type="number" id="tri-qy" value="-3" step="any"/></div>
            <div class="inp-group"><label>z</label><input type="number" id="tri-qz" value="6" step="any"/></div>
          </div>
        </div>
        <!-- Punto R -->
        <div style="margin-bottom:14px">
          <div style="font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--green);margin-bottom:6px;">Punto R</div>
          <div class="u-row-wrap">
            <div class="inp-group"><label>x</label><input type="number" id="tri-rx" value="3" step="any"/></div>
            <div class="inp-group"><label>y</label><input type="number" id="tri-ry" value="2" step="any"/></div>
            <div class="inp-group"><label>z</label><input type="number" id="tri-rz" value="-3" step="any"/></div>
          </div>
        </div>

        <button class="action-btn" data-action="triCalc">Calcular y graficar</button>
        <button class="action-btn action-btn-secondary" data-action="triClear">Limpiar</button>
        <div class="u-mt-3" id="tri-res"></div>
      </div>
    </div>
    <div id="pF" class="panel">
      <div class="u-pad">
        <div class="section-title">Figuras Geométricas 3D</div>
        <div class="u-note-math">
          Selecciona una figura, ajusta parámetros y grafícala sobre el canvas.
        </div>

        <!-- Selector de figura -->
        <div style="margin-bottom:12px">
          <div style="font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--al2);margin-bottom:6px;">Figura</div>
          <div class="u-row-wrap" id="fig-type-btns">
            <button class="fig-type-btn on" data-action="figSetType" data-arg="sphere">Esfera</button>
            <button class="fig-type-btn" data-action="figSetType" data-arg="cylinder">Cilindro</button>
            <button class="fig-type-btn" data-action="figSetType" data-arg="cone">Cono</button>
            <button class="fig-type-btn" data-action="figSetType" data-arg="plane">Plano</button>
            <button class="fig-type-btn" data-action="figSetType" data-arg="torus">Toro</button>
          </div>
        </div>

        <!-- Centro -->
        <div class="u-mb-2">
          <div style="font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text2);margin-bottom:6px;">Centro (cx, cy, cz)</div>
          <div class="u-row-wrap">
            <div class="inp-group"><label>cx</label><input type="number" id="fig-cx" value="0" step="any"/></div>
            <div class="inp-group"><label>cy</label><input type="number" id="fig-cy" value="0" step="any"/></div>
            <div class="inp-group"><label>cz</label><input type="number" id="fig-cz" value="0" step="any"/></div>
          </div>
        </div>

        <!-- Parámetros dinámicos -->
        <div class="u-mb-2" id="fig-params"></div>

        <!-- Color y opacidad -->
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
          <div class="inp-group" style="flex:0 0 auto">
            <label>Color</label>
            <input type="color" id="fig-color" value="#a594ff" style="width:44px;height:28px;padding:2px;background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer"/>
          </div>
          <div class="inp-group" style="flex:1;min-width:100px">
            <label>Opacidad</label>
            <input type="range" id="fig-opacity" min="5" max="60" value="22" style="width:100%;accent-color:var(--al)"/>
          </div>
          <span id="fig-opacity-val" style="font-family:var(--font-math);font-size:12px;color:var(--text3);min-width:28px">22%</span>
        </div>

        <button class="action-btn" data-action="figDraw">Graficar</button>
        <button class="action-btn action-btn-secondary" data-action="figClear">Limpiar</button>
        <div id="fig-res" style="margin-top:10px;font-family:var(--font-math);font-size:12px;color:var(--text3)"></div>
      </div>
    </div>
  </div>
  </div><!-- /#app-body -->
</div><!-- /#app -->
