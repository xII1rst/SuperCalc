<!-- LAUNCHER v3 — Super Calc -->
<div id="launcher">
  <div class="launcher-page">
  <div class="sc-logo">
    <svg id="sc-omega-logo" width="152" height="152" aria-hidden="true" focusable="false" viewBox="-105 -105 210 210"
      fill="none" xmlns="http://www.w3.org/2000/svg"
      style="overflow:visible">
      <defs>
        <radialGradient id="gOmega" cx="50%" cy="35%" r="65%">
          <stop offset="0%"   stop-color="var(--brand-omega-0)"/>
          <stop offset="40%"  stop-color="var(--brand-omega-1)"/>
          <stop offset="100%" stop-color="var(--brand-omega-2)"/>
        </radialGradient>
        <filter id="fGlw" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.8" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="fGlwSm" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="1.8" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="fHalo" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="8" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Grid -->
      <g stroke="var(--brand-grid)" stroke-width=".35" opacity=".13">
        <line x1="-100" y1="-80" x2="100" y2="-80"/>
        <line x1="-100" y1="-60" x2="100" y2="-60"/>
        <line x1="-100" y1="-40" x2="100" y2="-40"/>
        <line x1="-100" y1="-20" x2="100" y2="-20"/>
        <line x1="-100" y1="0"   x2="100" y2="0"/>
        <line x1="-100" y1="20"  x2="100" y2="20"/>
        <line x1="-100" y1="40"  x2="100" y2="40"/>
        <line x1="-100" y1="60"  x2="100" y2="60"/>
        <line x1="-100" y1="80"  x2="100" y2="80"/>
        <line x1="-80" y1="-100" x2="-80" y2="100"/>
        <line x1="-60" y1="-100" x2="-60" y2="100"/>
        <line x1="-40" y1="-100" x2="-40" y2="100"/>
        <line x1="-20" y1="-100" x2="-20" y2="100"/>
        <line x1="0"   y1="-100" x2="0"   y2="100"/>
        <line x1="20"  y1="-100" x2="20"  y2="100"/>
        <line x1="40"  y1="-100" x2="40"  y2="100"/>
        <line x1="60"  y1="-100" x2="60"  y2="100"/>
        <line x1="80"  y1="-100" x2="80"  y2="100"/>
      </g>
      <!-- Órbitas -->
      <ellipse cx="0" cy="0" rx="88" ry="24" stroke="var(--brand-orbit1)" stroke-width="1.2" fill="none" opacity=".55" stroke-dasharray="4 2"/>
      <ellipse cx="0" cy="0" rx="88" ry="24" stroke="var(--brand-orbit2)" stroke-width="1.1" fill="none" opacity=".5"  stroke-dasharray="4 2" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="88" ry="24" stroke="var(--brand-orbit3)" stroke-width="1.1" fill="none" opacity=".5"  stroke-dasharray="4 2" transform="rotate(-60)"/>
      <!-- Electrones -->
      <g id="sc-e1">
        <circle r="14" fill="var(--brand-electron-bg)" stroke="var(--brand-orbit1)" stroke-width="1.3" filter="url(#fGlwSm)"/>
        <text x="0" y="5.5" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="var(--brand-electron1)" filter="url(#fGlwSm)">∑</text>
      </g>
      <g id="sc-e2">
        <circle r="14" fill="var(--brand-electron-bg)" stroke="var(--brand-orbit2)" stroke-width="1.3" filter="url(#fGlwSm)"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="700" fill="var(--brand-electron2)" filter="url(#fGlwSm)">π</text>
      </g>
      <g id="sc-e3">
        <circle r="14" fill="var(--brand-electron-bg)" stroke="var(--brand-orbit3)" stroke-width="1.3" filter="url(#fGlwSm)"/>
        <text x="0" y="5.5" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="var(--brand-electron3)" filter="url(#fGlwSm)">∂</text>
      </g>
      <!-- Halo + Ω -->
      <circle cx="0" cy="0" r="40" fill="var(--brand-halo)" filter="url(#fHalo)"/>
      <text x="0" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="72" font-weight="700" fill="url(#gOmega)" filter="url(#fGlw)">Ω</text>
    </svg>
    <div class="sc-logo-text">
      <h1 class="sc-logo-name">SuperCalc</h1>
    </div>
  </div>
  <button class="search-trigger launcher-search" type="button" data-action="searchOpen" aria-haspopup="dialog" aria-controls="tool-search-dialog" aria-keyshortcuts="Control+k Meta+k">
    <svg class="sc-icon" aria-hidden="true"><use href="#sc-icon-search"></use></svg>
    <span>Buscar herramienta</span><kbd>Ctrl / ⌘ K</kbd>
  </button>
  <nav class="launcher-modules" aria-label="Materias">
    <button class="lmod-card math" type="button" data-action="openSubmod" data-arg="math">
      <span class="lmod-icon"><svg class="sc-icon" aria-hidden="true"><use href="#sc-icon-math"></use></svg></span>
      <span class="lmod-text">
        <span class="lmod-name">Matemáticas</span>
        <span class="lmod-sub">Álgebra, cálculo, análisis numérico, lógica, estadística, probabilidad y experimentos</span>
      </span>
      <span class="lmod-arrow"><svg class="sc-icon" aria-hidden="true"><use href="#sc-icon-chevron"></use></svg></span>
    </button>
    <button class="lmod-card fi" type="button" data-action="openSubmod" data-arg="fi">
      <span class="lmod-icon"><svg class="sc-icon" aria-hidden="true"><use href="#sc-icon-physics"></use></svg></span>
      <span class="lmod-text">
        <span class="lmod-name">Física</span>
        <span class="lmod-sub">Electromagnetismo, mecánica y ondas</span>
      </span>
      <span class="lmod-arrow"><svg class="sc-icon" aria-hidden="true"><use href="#sc-icon-chevron"></use></svg></span>
    </button>
  </nav>
  <div class="theme-switch-wrap">
    <span class="theme-switch-lbl" id="theme-lbl-dark" aria-hidden="true">Pizarra</span>
    <button class="theme-switch-track" id="theme-switch" type="button" role="switch" aria-label="Tema papel (claro)" aria-checked="false" data-action="toggleTheme">
      <span class="theme-switch-knob"></span>
    </button>
    <span class="theme-switch-lbl" id="theme-lbl-light" aria-hidden="true">Papel</span>
  </div>
  </div>
</div>
